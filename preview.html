<!doctype html>
<html lang="zh-CN" class="pl-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>月林序章 · 样式预览</title>
  <link rel="stylesheet" href="./styles/login.css?v=20261012-chronicle-2">
  <style>.pl-stage .pl-native-form :disabled{opacity:1!important}</style>
</head>
<body class="pl-active">
  <main id="join-game" aria-label="登录页样式预览">
    <section class="pl-native-form" data-pl-item="login" aria-label="登录卡片预览">
      <h2>启程</h2>
      <p class="pl-status">样式预览 · 返回登录页后可登录</p>
      <div class="form-group"><div class="form-fields"><select disabled aria-label="账户选择预览"><option>选择账户</option></select></div></div>
      <div class="form-group"><div class="form-fields"><input type="password" disabled placeholder="账户密码（未设置可留空）" aria-label="密码输入预览"></div></div>
      <button type="button" disabled>进入冒险</button>
    </section>
  </main>
  <script type="module">
    import {defaults,normalize,SERVER_URL,UI_STYLES} from './scripts/model.mjs';
    import {createScene,updateScene,element} from './scripts/scene.mjs';
    const config=normalize(defaults),root=document.querySelector('#join-game');
    const requestedStyle=new URLSearchParams(location.search).get('style');
    let style=UI_STYLES.some(item=>item.id===requestedStyle)?requestedStyle:'chronicle',selectedId=style==='ballad'?'bard':config.characters[0].id;
    const select=id=>{
      selectedId=id;
      for(const character of config.characters)character.uiStyle=style;
      updateScene(root,config,config.characters.find(character=>character.id===selectedId));
      document.title=`${UI_STYLES.find(item=>item.id===style).label} · 样式预览`;
    };
    createScene(root,config,{onSelect:select});
    const tools=element('nav','pl-tools');tools.setAttribute('aria-label','预览导航');
    const styleSelect=element('select');styleSelect.setAttribute('aria-label','预览风格');
    for(const item of UI_STYLES){const option=element('option','',item.label);option.value=item.id;styleSelect.append(option);}
    styleSelect.value=style;
    styleSelect.addEventListener('change',()=>{
      style=styleSelect.value;
      select(selectedId);
    });
    const back=element('a','','返回登录页');back.href=new URL('join',SERVER_URL).href;
    tools.append(styleSelect,back);root.querySelector('.pl-header').append(tools);
    select(selectedId);
  </script>
</body>
</html>
